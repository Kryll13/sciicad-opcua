# Configuration du Global Discovery Server SCIICAD
#
# Le GDS et le LDS partagent les memes options : la difference tient a la
# portee du registre (global) et au chemin de l'endpoint.
#
# Portee "global" : une inscription reste valide jusqu'a son retrait explicite.
# Aucun renouvellement periodique n'est donc impose aux serveurs inscrits, et
# le registre restaure au demarrage fait foi. C'est ce qui distingue un GDS
# d'un LDS, dont les entrees restaurees sont soumises au TTL.
#
# Le champ server.endpoint_path n'est pas modifiable ici volontairement : la
# Part 12 impose /GlobalDiscoveryServer pour ce role, et c'est ce qui permet a
# un client de distinguer un GDS d'un LDS sur la seule URL.

server:
  bind_address: 0.0.0.0
  port: 4840

  # Sur une VM, renseigner une adresse joignable par les clients. Le hostname
  # de la machine ne l'est pas necesariamente.
  advertise_host: null

  application_name: SCIICAD GDS
  application_uri: urn:SCIICAD:gds
  product_uri: urn:SCIICAD:product:gds
  manufacturer_name: SCIICAD
  software_version: "1.0"

discovery:
  scope: global
  find_servers_on_network: true

  # Sans effet en portee globale : conserve pour la lisibilite du fichier et
  # pour un basculement eventuel vers "local".
  entry_ttl_seconds: 300
  sweep_interval_seconds: 60

database:
  enabled: true
  path: gds.db
  event_log: true

certificates:
  # Groupes de certificats rattaches au demarrage (Part 12 §7.8.3.3). Ils sont
  # publies sous ServerConfiguration.CertificateGroups, a l'endroit que la norme
  # leur reserve, et reutilisent les instances que le serveur a deja creees.
  #
  # Les trois sont repris par defaut, et c'est delibere : un groupe laisse
  # hors de cette liste reste dans l'espace d'adressage SANS gestionnaire, et
  # repondrait BadNothingToDo. Un groupe vide mais cable se constate et
  # s'explique ; un noeud muet se decouvre par l'echec d'un appel.
  #
  # Un groupe sans certificat est un groupe vide : c'est conforme, un GDS qui
  # n'a encore distribue rien n'a rien a annoncer.
  groups:
    - DefaultApplicationGroup
    - DefaultHttpsGroup
    - DefaultUserTokenGroup

  # Publier l'objet ServerConfiguration et ses methodes de signature
  # (Part 12 §7.10), qui font du GDS un CertificateManager : il prepare une
  # demande de signature, conserve la cle, et installe le certificat signe par
  # une autorite d'enregistrement exterieure.
  #
  # Le GDS ne possede donc aucune cle de CA. Mettre a false si le
  # deploiement distribue des listes de confiance sans gerer de certificats.
  manage_certificates: true

  # Taille des cles generees par CreateSigningRequest, en bits (2048..4096).
  key_size: 2048

  # Noms d'hote ajoutes au SAN des demandes de signature, en plus de l'URI
  # d'application. Vide par defaut : c'est a l'administrateur de dire quelle
  # identite le GDS doit annoncer.
  hostnames: []

