# Configuration du Global Discovery Server SCIICAD
#
# Le GDS et le LDS partagent les memes options : la difference tient a la
# portee du registre (global) et au chemin de l'endpoint.
#
# Portee "global" : une inscription reste valide jusqu'a son retrait explicite.
# Aucun renouvellement periodique n'est donc impose aux serveurs inscrits, et
# le registre restaure au demarrage fait foi. C'est ce qui distingue un GDS
# d'un LDS, dont les entrees restaurees sont soumises au TTL.
#
# Le champ server.endpoint_path n'est pas modifiable ici volontairement : la
# Part 12 impose /GlobalDiscoveryServer pour ce role, et c'est ce qui permet a
# un client de distinguer un GDS d'un LDS sur la seule URL.

server:
  bind_address: 0.0.0.0
  port: 4840

  # Sur une VM, renseigner une adresse joignable par les clients. Le hostname
  # de la machine ne l'est pas necesariamente.
  advertise_host: null

  # Certificat applicatif et cle privee. Leur presence est une OBLIGATION pour
  # un serveur de decouverte, pas une precaution : Part 12 6.2 fait du
  # certificat du canal l'IDENTITE de l'application, et 6.5.6 impose
  # SignAndEncrypt pour RegisterApplication. Un serveur de decouverte qui
  # n'annonce que NoSecurity ne peut pas satisfaire ce role.
  #
  # Vides, le serveur demarre quand meme en mode degrade, et l'avertissement le
  # dit en nommant la consequence — parce qu'un mode degrade passe inaperçu
  # jusqu'a la premiere inscription, ce qui est le pire moment pour le decouvrir.
  certificate: gds/server_certificate.pem
  private_key: gds/server_private_key.pem

  # Sign protege l'integrite sans proteger la confidentialite. Faux par defaut :
  # accepter Sign laisserait croire qu'une inscription est protegee alors qu'elle
  # resterait lisible. Basic256Sha256_SignAndEncrypt reste toujours annonce.
  allow_sign_only: false

  application_name: SCIICAD GDS
  application_uri: urn:SCIICAD:gds
  product_uri: urn:SCIICAD:product:gds
  manufacturer_name: SCIICAD
  software_version: "1.0"

discovery:
  scope: global
  find_servers_on_network: true

  # Sans effet en portee globale : conserve pour la lisibilite du fichier et
  # pour un basculement eventuel vers "local".
  entry_ttl_seconds: 300
  sweep_interval_seconds: 60

database:
  enabled: true
  path: gds.db
  event_log: true

certificates:
  # Groupes de certificats rattaches au demarrage (Part 12 §7.8.3.3). Ils sont
  # publies sous ServerConfiguration.CertificateGroups, a l'endroit que la norme
  # leur reserve, et reutilisent les instances que le serveur a deja creees.
  #
  # Les trois sont repris par defaut, et c'est delibere : un groupe laisse
  # hors de cette liste reste dans l'espace d'adressage SANS gestionnaire, et
  # repondrait BadNothingToDo. Un groupe vide mais cable se constate et
  # s'explique ; un noeud muet se decouvre par l'echec d'un appel.
  #
  # Un groupe sans certificat est un groupe vide : c'est conforme, un GDS qui
  # n'a encore distribue rien n'a rien a annoncer.
  groups:
    - DefaultApplicationGroup
    - DefaultHttpsGroup
    - DefaultUserTokenGroup

  # Publier l'objet ServerConfiguration et ses methodes de signature
  # (Part 12 §7.10), qui font du GDS un CertificateManager : il prepare une
  # demande de signature, conserve la cle, et installe le certificat signe par
  # une autorite d'enregistrement exterieure.
  #
  # Le GDS ne possede donc aucune cle de CA. Mettre a false si le
  # deploiement distribue des listes de confiance sans gerer de certificats.
  manage_certificates: true

  # Taille des cles generees par CreateSigningRequest, en bits (2048..4096).
  key_size: 2048

  # Noms d'hote ajoutes au SAN des demandes de signature, en plus de l'URI
  # d'application. Vide par defaut : c'est a l'administrateur de dire quelle
  # identite le GDS doit annoncer.
  hostnames: []

  # ANCRAGE DE CONFIANCE — Part 12 §7.1
  #
  # La norme ne definit aucun amorcage en bande. §7.1 exige l'inverse :
  # « Clients shall only connect to a CertificateManager which the Client has
  # been configured to trust. This may require an out of band configuration step
  # which is completed prior to starting the manual onboarding process. »
  #
  # Ce champ est donc l'ancre du deploiement, posee hors bande et avant tout
  # demarrage. Il se remplit par tools/bootstrap_certificates.py, qui produit
  # les certificats constructeurs des quatre roles et depose ici leurs
  # COPIES PUBLIQUES — sans les cles privees. Un chemin de fichier est accepte
  # aussi bien qu'un dossier, developpe alors sur *.pem, *.der et *.crt.
  #
  # Ces certificats entrent dans la liste SANS passer la validation de
  # gds/certstore.py, et c'est deliberé : la validation certifie ce qu'un
  # certificat presente par le reseau respecte le profil, alors qu'ici
  # l'administrateur DECIDE que cette cle est de confiance. La faire passer par
  # la validation la rendrait dependante d'elle-meme — et elle echouerait, car
  # le defaut ferme de §7.8.2.10 refuse un certificat sans CRL, donc refuse
  # precisement celui qui sert d'ancre. Une ancre ne peut pas exiger la preuve
  # de sa propre existence.
  #
  # Ces ancres n'ont pas de CRL, ce qui est coherent tant qu'aucune autorite de
  # certification n'est en service : le defaut ferme de §7.8.2.10 s'applique a la
  # VALIDATION des certificats presentes par le reseau, pas a la constitution
  # initiale de la liste.
  trusted_certificates:
    - pki/trusted

  # Groupe destinataire. Les CertificateTypes d'un groupe disent a quoi sert ce
  # qu'il contient : un certificat d'application n'a de sens que dans
  # DefaultApplicationGroup. Le mettre ailleurs rendrait la liste incoherent
  # avec sa propre declaration.
  #
  # Un ancrage vise un groupe non attache est signale et IGNORE, jamais
  # redirige : place dans le mauvais groupe, il accepterait des presentations qui
  # ne doivent pas l'etre.
  trusted_certificates_group: DefaultApplicationGroup

  # AUTORITE DE CERTIFICATION du deploiement. Hors bande aussi : la Part 12 ne
  # definit aucun mecanisme en bande pour la confiance, et le GDS ne peut pas
  # etre une autorite (aucun role de ce type dans le NodeIds officiel).
  # L'outillage est tools/authority.py, dont la cle privee vit HORS du depot.
  #
  # Le certificat de l'autorite est un ISSUER, pas un certificat de confiance :
  # il authentifie ce qui a signe, pas l'application. Le placer dans
  # trusted_certificates le ferait aussi, et plus permissivement — il vaudrait
  # validation directe de tout certificat qu'il a signe.
  #
  # issuer_crls n'est pas une precaution : sans CRL de l'emetteur, l'etat de
  # revocation est INCONNU, et le defaut ferme de §7.8.2.10 refuse — un refus
  # correct, mais sans issue. Les deux declarations vont donc ensemble, ou pas.
  #
  # Une CRL n'est appliquee que si sa signature se verifie avec la cle de
  # l'emetteur de confiance. Une CRL portant le bon nom d'emetteur mais signee
  # par une autre cle est IGNOREE : elle ne peut ni revoquer (elle ne prouve
  # rien) ni blanchir (les revocations sont une union, pas une intersection).
  issuer_certificates:
    - pki/ca
  issuer_crls:
    - pki/crl

audit:
  # Evenements d'audit OPC UA (Part 12 7.8.2.13 et 7.10.27). Un client abonne
  # recoit TrustListUpdatedAuditEventType quand la liste de confiance change, et
  # CertificateUpdatedAuditEventType quand un certificat est installe.
  #
  # A NE PAS confondre avec database.event_log, qui ecrit des lignes dans une
  # table SQLite : l'evenement d'audit est une notification OPC UA, il n'atteint
  # que les clients abonnes. Desactiver ici laisse les modifications de
  # certificats silencieuses pour tout client OPC UA.
  enabled: true

